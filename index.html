<!DOCTYPE html>
<html lang="hu">
<head>

  <a class="skip-link" href="#main" data-i18n="skip">Ugrás a tartalomhoz</a>

  <header class="site-header" id="top">

      <nav class="primary-nav" id="primary-nav" aria-label="Főmenü">

          <li><a href="#about" data-i18n="nav.about">Rólam</a></li>
          <li><a href="#education" data-i18n="nav.education">Tanulmányok</a></li>

          <li><a href="#skills" data-i18n="nav.skills">Készségek</a></li>
          <li data-works-only><a href="#works" data-i18n="nav.works">Munkáim</a></li>
          <li><a href="#contact" data-i18n="nav.contact">Kapcsolat</a></li>
        </ul>

      <div class="header-actions">
        <div class="lang-switch" role="group" data-i18n-aria="langLabel" aria-label="Nyelv kiválasztása">
          <button type="button" data-lang="hu" lang="hu" aria-pressed="true">HU</button>
          <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="btn btn-primary cv-link header-cv" href="assets/cv/Levente_Fehervari_CV_EN.pdf" download>

    </div>

  <main id="main">

      <div class="container">
        <p class="eyebrow" data-i18n="role"></p>

    <section id="about" class="section">
      <div class="container grid">
        <h2 data-i18n="sections.about"></h2>

    <section id="education" class="section">
      <div class="container grid">

    <section id="experience" class="section">
      <div class="container grid">
        <h2 data-i18n="sections.experience"></h2>
        <ol class="timeline" data-render="experience"></ol>

    <section id="skills" class="section">
      <div class="container grid">
        <h2 data-i18n="sections.skills"></h2>

    <section id="contact" class="section">

        <h2 data-i18n="sections.contact"></h2>
        <div>
          <p class="prose" data-i18n="contactText"></p>
          <p class="contact-line"><a class="email-link" data-site="email" href="mailto:levente.fehervari2004@gmail.com">levente.fehervari2004@gmail.com</a></p>
          <p><a class="btn btn-ghost cv-link" href="assets/cv/Levente_Fehervari_CV_EN.pdf" download><span data-cv-label></span></a></p>
        </div>
      </div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-site="name">Fehérvári Levente</span></span>
      <span data-i18n="footer"></span>
    </div>

  <script src="js/content.js"></script>
  <script src="js/works.js"></script>
  <script src="js/main.js"></script>
